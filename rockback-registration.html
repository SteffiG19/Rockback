<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Rockback Car Show — Registration</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --black: #080808;
    --green: #39ff14;
    --green-dim: rgba(57,255,20,0.15);
    --green-border: rgba(57,255,20,0.3);
    --white: #f0f0f0;
    --grey: #111111;
    --grey2: #1a1a1a;
    --grey3: #252525;
    --text-muted: #666;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--black); color: var(--white); font-family: 'DM Sans', sans-serif; min-height: 100vh; padding-bottom: 60px; }

  header {
    background: var(--grey);
    border-bottom: 2px solid var(--green);
    padding: 16px 20px 12px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 0 20px rgba(57,255,20,0.15);
  }
  header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 3px; color: var(--green); line-height: 1; text-shadow: 0 0 20px rgba(57,255,20,0.5); }
  header .sub { font-size: 10px; color: var(--text-muted); font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
  .reg-count { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--green); letter-spacing: 1px; text-align: right; line-height: 1; }
  .reg-count-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

  main { padding: 18px 16px; max-width: 520px; margin: 0 auto; }

  .card { background: var(--grey); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; border: 1px solid #222; }
  .card-label { font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--green); margin-bottom: 10px; opacity: 0.8; }

  input[type="text"] {
    width: 100%; background: var(--grey2); border: 1px solid #2a2a2a;
    border-radius: 8px; color: var(--white); font-family: 'DM Sans', sans-serif;
    font-size: 16px; padding: 13px 14px; outline: none; transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  input:focus { border-color: var(--green); box-shadow: 0 0 0 2px rgba(57,255,20,0.1); }
  .optional-tag { font-size: 10px; color: var(--text-muted); margin-left: 6px; font-weight: 400; letter-spacing: 0; text-transform: none; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* CATEGORIES */
  .cat-group-title { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 6px 0; margin-bottom: 8px; border-bottom: 1px solid #222; }
  .cat-group-title.static { color: #818cf8; }
  .cat-group-title.bagged { color: #f59e0b; }
  .cat-group-title.overall { color: var(--green); }
  .cat-checkboxes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .cat-check-label {
    display: flex; align-items: center; gap: 7px;
    background: var(--grey2); border: 1px solid #2a2a2a;
    border-radius: 8px; padding: 8px 12px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all 0.15s; user-select: none;
  }
  .cat-check-label input[type="checkbox"] { display: none; }
  .cat-check-label.checked { background: var(--green-dim); border-color: var(--green-border); color: var(--green); }
  .check-box { width: 16px; height: 16px; border-radius: 4px; border: 2px solid #444; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
  .cat-check-label.checked .check-box { background: var(--green); border-color: var(--green); }
  .check-tick { display: none; color: #000; font-size: 11px; font-weight: 900; }
  .cat-check-label.checked .check-tick { display: block; }

  /* FEE */
  .fee-display {
    background: var(--green-dim); border: 1px solid var(--green-border);
    border-radius: var(--radius); padding: 14px 18px; margin-bottom: 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .fee-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); }
  .fee-val { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--green); letter-spacing: 2px; line-height: 1; text-shadow: 0 0 10px rgba(57,255,20,0.4); }
  .fee-cats { font-size: 12px; color: rgba(57,255,20,0.6); margin-top: 2px; }

  /* SUBMIT */
  .submit-btn {
    width: 100%; background: var(--green); color: #000; border: none;
    border-radius: var(--radius); font-family: 'Bebas Neue', sans-serif;
    font-size: 22px; letter-spacing: 3px; padding: 18px;
    cursor: pointer; transition: all 0.2s; margin-top: 4px;
    box-shadow: 0 0 20px rgba(57,255,20,0.3);
  }
  .submit-btn:active { transform: scale(0.98); box-shadow: none; }
  .submit-btn:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; }

  /* RECENT */
  .recent-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px; color: var(--text-muted); margin: 24px 0 12px; }
  .recent-item { background: var(--grey); border: 1px solid #1a1a1a; border-radius: var(--radius); padding: 12px 16px; margin-bottom: 8px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .recent-car { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; color: var(--green); }
  .recent-name { font-size: 14px; font-weight: 600; }
  .recent-spot { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .recent-cats { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .recent-cat-tag { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; background: var(--green-dim); color: var(--green); border: 1px solid var(--green-border); }
  .delete-btn { background: none; border: none; color: #333; font-size: 18px; cursor: pointer; padding: 0 4px; flex-shrink: 0; transition: color 0.15s; }
  .delete-btn:hover { color: #ff4444; }
  .empty-recent { font-size: 13px; color: var(--text-muted); font-style: italic; padding: 10px 0; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #111; border: 1px solid var(--green); color: var(--green);
    padding: 12px 22px; border-radius: 40px; font-size: 14px; font-weight: 500;
    z-index: 999; transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
    white-space: nowrap; box-shadow: 0 0 20px rgba(57,255,20,0.2);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: #ff4444; color: #ff4444; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Rockback</h1>
    <div class="sub">Registration Desk</div>
  </div>
  <div style="text-align:right">
    <div class="reg-count" id="reg-count">0</div>
    <div class="reg-count-label">Registered</div>
  </div>
</header>
<main>
  <div class="card">
    <div class="card-label">Car Number</div>
    <input type="text" id="car-number" placeholder="e.g. A12 or 042"
      maxlength="10" autocomplete="off" autocorrect="off"
      autocapitalize="characters" spellcheck="false"
      oninput="this.value=this.value.toUpperCase()"/>
  </div>
  <div class="card">
    <div class="card-label">Participant Name</div>
    <input type="text" id="owner-name" placeholder="Full name" autocomplete="off"/>
  </div>
  <div class="card">
    <div class="card-label">Vehicle Details</div>
    <div class="row2" style="margin-bottom:10px">
      <input type="text" id="vehicle-make" placeholder="Make (e.g. Honda)" autocomplete="off"/>
      <input type="text" id="vehicle-model" placeholder="Model (e.g. Civic)" autocomplete="off"/>
    </div>
    <input type="text" id="vehicle-year" placeholder="Year (e.g. 2020)" maxlength="4" inputmode="numeric" autocomplete="off"/>
  </div>
  <div class="card">
    <div class="card-label">Parking Spot <span class="optional-tag">(optional)</span></div>
    <input type="text" id="parking-spot" placeholder="e.g. B4"
      maxlength="10" autocomplete="off" autocorrect="off"
      autocapitalize="characters" spellcheck="false"
      oninput="this.value=this.value.toUpperCase()"/>
  </div>
  <div class="card">
    <div class="card-label">Categories Selected</div>
    <div class="cat-section">
      <div class="cat-group-title static">Static</div>
      <div class="cat-checkboxes" id="cats-static"></div>
    </div>
    <div class="cat-section">
      <div class="cat-group-title bagged">Bagged</div>
      <div class="cat-checkboxes" id="cats-bagged"></div>
    </div>
    <div class="cat-section">
      <div class="cat-group-title overall">Overall</div>
      <div class="cat-checkboxes" id="cats-overall"></div>
    </div>
  </div>
  <div class="fee-display">
    <div>
      <div class="fee-label">Entry Fee</div>
      <div class="fee-cats" id="fee-cats">No categories selected</div>
    </div>
    <div style="text-align:right">
      <div class="fee-val" id="fee-val">$0</div>
    </div>
  </div>
  <button class="submit-btn" id="submit-btn" onclick="submitReg()">REGISTER PARTICIPANT</button>
  <div class="recent-title">Today's Registrations</div>
  <div id="recent-list"></div>
</main>
<div class="toast" id="toast"></div>
<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbynxTbwFabFadw2jB_2abF9QS-gqtGtG_iBzB3N-_tEGyU_PpWOrBIHB2hwSedjplw/exec";
const FEE_PER_CAT = 50;
const LOCAL_KEY = 'rockback_registrations';
const CATS = {
  static:  ['Low with Standards 18','Low with Standards 20','Best Stance'],
  bagged:  ['Low and Fresh 18','Low and Fresh 20','Low and Fresh 22','Best Fitment'],
  overall: ['Best Paint Job','Best Wrap','Best Nissan','Best Toyota','Best Honda',
            'Best Mazda','Best Mitsubishi','Best Van','Best Panel Van','Best SUV',
            'Old School','Engine Bay','Best Offroad']
};
['static','bagged','overall'].forEach(group => {
  const wrap = document.getElementById('cats-' + group);
  CATS[group].forEach(cat => {
    const label = document.createElement('label');
    label.className = 'cat-check-label';
    label.innerHTML = `<input type="checkbox" value="${cat}"/><span class="check-box"><span class="check-tick">✓</span></span>${cat}`;
    label.querySelector('input').addEventListener('change', function() {
      label.classList.toggle('checked', this.checked);
      onCatChange();
    });
    wrap.appendChild(label);
  });
});
function onCatChange() {
  const selected = getSelectedCats();
  const fee = selected.length * FEE_PER_CAT;
  document.getElementById('fee-val').textContent = '$' + fee;
  document.getElementById('fee-cats').textContent = selected.length
    ? selected.length + ' categor' + (selected.length === 1 ? 'y' : 'ies') + ' selected'
    : 'No categories selected';
}
function getSelectedCats() {
  return [...document.querySelectorAll('.cat-check-label input:checked')].map(i => i.value);
}
async function submitReg() {
  const carNum  = document.getElementById('car-number').value.trim().toUpperCase();
  const name    = document.getElementById('owner-name').value.trim();
  const make    = document.getElementById('vehicle-make').value.trim();
  const model   = document.getElementById('vehicle-model').value.trim();
  const year    = document.getElementById('vehicle-year').value.trim();
  const parking = document.getElementById('parking-spot').value.trim().toUpperCase();
  const cats    = getSelectedCats();
  if (!carNum) { showToast('Car number required', 'error'); return; }
  if (!name)   { showToast('Participant name required', 'error'); return; }
  if (!cats.length) { showToast('Select at least one category', 'error'); return; }
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'REGISTERING...';
  const payload = {
    type: 'registration', timestamp: new Date().toISOString(),
    car_number: carNum, name, make, model, year, parking_spot: parking,
    categories: cats, fee: cats.length * FEE_PER_CAT
  };
  saveLocalReg(payload);
  renderRecentList();
  try {
    await fetch(SHEET_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
    showToast('✓ #' + carNum + ' — ' + name + ' registered');
  } catch(e) {
    showToast('Saved locally — will sync when online');
  }
  resetForm();
  btn.disabled = false; btn.textContent = 'REGISTER PARTICIPANT';
}
function saveLocalReg(p) {
  const regs = loadLocalRegs(); regs.unshift(p);
  localStorage.setItem(LOCAL_KEY, JSON.stringify(regs));
  document.getElementById('reg-count').textContent = regs.length;
}
function loadLocalRegs() {
  try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]'); } catch(e) { return []; }
}
function deleteLocalReg(carNum, ts) {
  const regs = loadLocalRegs().filter(r => !(r.car_number === carNum && r.timestamp === ts));
  localStorage.setItem(LOCAL_KEY, JSON.stringify(regs));
  document.getElementById('reg-count').textContent = regs.length;
  renderRecentList();
}
function renderRecentList() {
  const regs = loadLocalRegs();
  const el = document.getElementById('recent-list');
  if (!regs.length) { el.innerHTML = '<div class="empty-recent">No registrations yet today</div>'; return; }
  el.innerHTML = regs.map(r => `
    <div class="recent-item">
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:2px">
          <div class="recent-car">#${r.car_number}</div>
          <div class="recent-name">${r.name}</div>
        </div>
        ${r.parking_spot ? `<div class="recent-spot">Parking: ${r.parking_spot}</div>` : ''}
        <div class="recent-cats">${r.categories.map(c => `<span class="recent-cat-tag">${c}</span>`).join('')}</div>
      </div>
      <button class="delete-btn" onclick="deleteLocalReg('${r.car_number}','${r.timestamp}')">✕</button>
    </div>`).join('');
}
function resetForm() {
  ['car-number','owner-name','vehicle-make','vehicle-model','vehicle-year','parking-spot'].forEach(id => document.getElementById(id).value = '');
  document.querySelectorAll('.cat-check-label').forEach(l => { l.classList.remove('checked'); l.querySelector('input').checked = false; });
  onCatChange();
  document.getElementById('car-number').focus();
}
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + type;
  void t.offsetWidth; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}
renderRecentList();
document.getElementById('reg-count').textContent = loadLocalRegs().length;
onCatChange();
</script>
</body>
</html>
